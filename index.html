<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>💕</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family:'Poppins',sans-serif;
      height:100vh; overflow:hidden;
      background:#0d0d1a;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg {
      position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #0a1628 0%, transparent 60%),
                  radial-gradient(ellipse at 60% 80%, #1a0520 0%, transparent 60%),
                  #0d0d1a;
    }
    /* floating hearts background */
    .hearts { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .heart {
      position:absolute; bottom:-40px;
      font-size:1.2rem; opacity:0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform:translateY(0) scale(1) rotate(-10deg); opacity:.15; }
      50%  { opacity:.08; }
      100% { transform:translateY(-110vh) scale(1.3) rotate(10deg); opacity:0; }
    }

    /* ── WRONG LINK ── */
    #wrongScreen {
      display:none; position:fixed; inset:0; z-index:999;
      flex-direction:column; align-items:center; justify-content:center;
      gap:14px; text-align:center; padding:30px;
      background:#0d0d1a;
    }
    #wrongScreen .lock { font-size:4rem; }
    #wrongScreen p { color:#ffffff44; font-size:.9rem; }

    /* ── MAIN CARD ── */
    .card {
      position:relative; z-index:10;
      width:min(360px, calc(100vw - 32px));
      display:flex; flex-direction:column; align-items:center;
      gap:20px;
    }

    /* ── TOP STATUS ── */
    .top-row {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:0 4px;
    }
    #liveDot {
      display:flex; align-items:center; gap:6px;
      font-size:.72rem; color:#ffffff66;
    }
    #liveDot span {
      width:7px; height:7px; border-radius:50%; background:#1abc9c;
      animation:blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    #locMethod {
      font-size:.68rem; color:#ffffff33;
    }

    /* ── AVATAR SECTION ── */
    .avatars {
      display:flex; align-items:center; justify-content:center; gap:0;
      width:100%;
    }
    .avatar-wrap {
      display:flex; flex-direction:column; align-items:center; gap:8px;
      flex:1;
    }
    .avatar {
      width:80px; height:80px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:2.2rem;
      border:3px solid transparent;
      position:relative;
    }
    .avatar-me {
      background:linear-gradient(135deg,#e94560,#c62a47);
      box-shadow:0 0 0 4px #e9456022, 0 8px 30px #e9456055;
    }
    .avatar-gf {
      background:linear-gradient(135deg,#8e44ad,#e74c9b);
      box-shadow:0 0 0 4px #e74c9b22, 0 8px 30px #e74c9b55;
    }
    .avatar-name {
      font-size:.75rem; color:#ffffff88; font-weight:400; letter-spacing:.5px;
    }
    .avatar-loc {
      font-size:.65rem; color:#ffffff44; max-width:120px;
      text-align:center; line-height:1.4;
    }
    .avatar-time {
      font-size:.6rem; color:#ffffff22; margin-top:2px;
    }

    /* online indicator on avatar */
    .online-dot {
      position:absolute; bottom:4px; right:4px;
      width:14px; height:14px; border-radius:50%;
      background:#1abc9c; border:2px solid #0d0d1a;
      display:none;
    }
    .online-dot.show { display:block; }

    /* heart connector */
    .heart-connector {
      font-size:1.6rem; flex-shrink:0; margin:0 8px;
      animation:pulse-heart 1.4s ease-in-out infinite;
      margin-bottom:48px;
    }
    @keyframes pulse-heart {
      0%,100%{transform:scale(1)} 50%{transform:scale(1.2)}
    }

    /* ── DISTANCE BADGE ── */
    .dist-badge {
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px; padding:8px 20px;
      font-size:.78rem; color:#ffffff77;
      display:flex; align-items:center; gap:8px;
    }
    .dist-badge span { color:#fff; font-weight:600; }

    /* ── CHAT BUTTON (big center) ── */
    #bigChatBtn {
      width:100%; padding:16px;
      background:linear-gradient(135deg,#e94560,#c62a47);
      border:none; border-radius:18px;
      color:#fff; font-size:1rem; font-weight:600;
      cursor:pointer; letter-spacing:.5px;
      display:flex; align-items:center; justify-content:center; gap:10px;
      box-shadow:0 8px 30px #e9456055;
      transition:transform .15s, box-shadow .15s;
      position:relative;
    }
    #bigChatBtn:active { transform:scale(.97); box-shadow:0 4px 16px #e9456044; }
    #chatBadge {
      position:absolute; top:-8px; right:-8px;
      background:#f7c59f; color:#1a1a2e;
      border-radius:50%; width:22px; height:22px;
      font-size:.7rem; font-weight:700;
      display:none; align-items:center; justify-content:center;
      border:2px solid #0d0d1a;
    }

    /* ── GPS UPGRADE BUTTON ── */
    #gpsBtn {
      width:100%; padding:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px; color:#ffffff88;
      font-size:.8rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-family:inherit; transition:background .2s;
    }
    #gpsBtn:active { background:rgba(255,255,255,.08); }
    #gpsBtn.gps-on { border-color:#1abc9c44; color:#1abc9c; background:#1abc9c11; }

    /* ── CHAT PANEL ── */
    #chatPanel {
      position:fixed; inset:0; z-index:100;
      display:none; flex-direction:column;
      background:#0d0d1a;
    }
    #chatPanel.open { display:flex; }

    #chatNav {
      display:flex; align-items:center; gap:12px;
      padding:14px 16px;
      background:rgba(255,255,255,.03);
      border-bottom:1px solid rgba(255,255,255,.06);
      flex-shrink:0;
    }
    #backBtn {
      background:none; border:none; color:#fff;
      font-size:1.3rem; cursor:pointer; padding:4px 8px;
    }
    #chatNavTitle {
      flex:1; font-size:.95rem; font-weight:600;
    }
    #onlineStatus { font-size:.72rem; color:#1abc9c; }

    #chatMessages {
      flex:1; overflow-y:auto; padding:16px;
      display:flex; flex-direction:column; gap:8px;
    }
    #chatMessages::-webkit-scrollbar { width:3px; }
    #chatMessages::-webkit-scrollbar-thumb { background:#ffffff15; border-radius:3px; }

    .msg { max-width:78%; padding:10px 14px; border-radius:18px; font-size:.85rem; line-height:1.5; word-break:break-word; }
    .msgTime { font-size:.62rem; color:#ffffff44; margin-top:3px; display:block; }
    .msg-me    { background:linear-gradient(135deg,#e94560,#c62a47); align-self:flex-end; border-bottom-right-radius:4px; }
    .msg-other { background:rgba(255,255,255,.08); align-self:flex-start; border-bottom-left-radius:4px; color:#ffffffdd; }

    #typingIndicator { font-size:.72rem; color:#ffffff33; padding:0 16px 6px; min-height:18px; flex-shrink:0; }

    #chatInputRow {
      display:flex; padding:12px 14px; gap:10px; flex-shrink:0;
      background:rgba(255,255,255,.03);
      border-top:1px solid rgba(255,255,255,.06);
    }
    #msgBox {
      flex:1; background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px; padding:10px 14px;
      color:#fff; font-size:.88rem; outline:none;
      resize:none; max-height:80px; font-family:inherit;
    }
    #msgBox::placeholder { color:#ffffff33; }
    #sendBtn {
      background:linear-gradient(135deg,#e94560,#c62a47);
      border:none; border-radius:14px; padding:10px 16px;
      color:#fff; cursor:pointer; font-size:1.1rem; flex-shrink:0;
    }

    /* ── TOAST ── */
    #toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:rgba(255,255,255,.1); backdrop-filter:blur(10px);
      color:#fff; padding:8px 20px; border-radius:20px;
      font-size:.8rem; z-index:9999; display:none;
      border:1px solid rgba(255,255,255,.15);
      white-space:nowrap;
    }
  </style>
</head>
<body>

<!-- BG -->
<div class="bg"></div>
<div class="hearts" id="hearts"></div>

<!-- Wrong link -->
<div id="wrongScreen">
  <div class="lock">🔒</div>
  <p>This link is not valid.<br>Ask for the correct link!</p>
</div>

<!-- Main UI -->
<div class="card" id="mainCard" style="display:none">

  <!-- Top row -->
  <div class="top-row">
    <div id="liveDot"><span></span> Live</div>
    <div id="locMethod">📡 Locating…</div>
  </div>

  <!-- Avatars -->
  <div class="avatars">
    <div class="avatar-wrap">
      <div class="avatar avatar-me">
        👦
        <div class="online-dot" id="dotMe"></div>
      </div>
      <div class="avatar-name" id="nameMe">Me</div>
      <div class="avatar-loc" id="locMe">…</div>
      <div class="avatar-time" id="timeMe"></div>
    </div>

    <div class="heart-connector">💗</div>

    <div class="avatar-wrap">
      <div class="avatar avatar-gf">
        👧
        <div class="online-dot" id="dotGf"></div>
      </div>
      <div class="avatar-name" id="nameGf">Her</div>
      <div class="avatar-loc" id="locGf">…</div>
      <div class="avatar-time" id="timeGf"></div>
    </div>
  </div>

  <!-- Distance -->
  <div class="dist-badge" id="distBadge">
    📍 <span id="distText">Calculating distance…</span>
  </div>

  <!-- Chat button -->
  <button id="bigChatBtn" onclick="openChat()">
    💬 &nbsp;Send a Message
    <span id="chatBadge"></span>
  </button>

  <!-- GPS upgrade -->
  <button id="gpsBtn" onclick="upgradeToGPS()">
    🎯 Tap for more precise location
  </button>

</div>

<!-- Chat panel -->
<div id="chatPanel">
  <div id="chatNav">
    <button id="backBtn" onclick="closeChat()">←</button>
    <div id="chatNavTitle">💬 Chat</div>
    <div id="onlineStatus">● …</div>
  </div>
  <div id="chatMessages"></div>
  <div id="typingIndicator"></div>
  <div id="chatInputRow">
    <textarea id="msgBox" placeholder="Type something sweet… 💕" rows="1"
      onkeydown="handleKey(event)" oninput="handleTyping()"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  🔥 FIREBASE CONFIG — REPLACE WITH YOURS
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyDEMO_REPLACE_ME",
  authDomain:        "mygf-tracker.firebaseapp.com",
  databaseURL:       "https://mygf-tracker-default-rtdb.firebaseio.com",
  projectId:         "mygf-tracker",
  storageBucket:     "mygf-tracker.appspot.com",
  messagingSenderId: "000000000000",
  appId:             "1:000000000000:web:0000"
};

// ═══════════════════════════════════════════
//  🔑 TOKENS  →  your link: ?t=boyfriend123
//              her link:   ?t=girlfriend456
// ═══════════════════════════════════════════
const TOKENS = { "boyfriend123":"me", "girlfriend456":"gf" };

const token       = new URLSearchParams(location.search).get("t") || "";
const currentUser = TOKENS[token] || null;
const OTHER       = { me:"gf", gf:"me" };

// ── Firebase / Demo ─────────────────────
let db;
const DEMO = firebaseConfig.apiKey.includes("DEMO_REPLACE_ME");
if (!DEMO) { firebase.initializeApp(firebaseConfig); db = firebase.database(); }

const DK = "mygf_v3";
const dg = () => { try{return JSON.parse(localStorage.getItem(DK))||{};}catch{return{};} };
const ds = o => localStorage.setItem(DK, JSON.stringify(o));
function dSet(p,v){
  const d=dg(),pts=p.split("/").filter(Boolean);let c=d;
  for(let i=0;i<pts.length-1;i++){if(!c[pts[i]])c[pts[i]]={};c=c[pts[i]];}
  c[pts[pts.length-1]]=v;ds(d);window.dispatchEvent(new Event("dc"));
}
function dOn(p,cb){
  const r=()=>{let c=dg();p.split("/").filter(Boolean).forEach(k=>c=c?.[k]);cb(c??null);};
  r();window.addEventListener("dc",r);window.addEventListener("storage",r);
  return setInterval(r,1200);
}
function dPush(p,v){const k="k"+Date.now()+Math.random().toString(36).slice(2,5);dSet(p+"/"+k,v);return k;}
function fbSet(p,v)    {DEMO?dSet(p,v)                                       :db.ref(p).set(v);}
function fbUpdate(p,v) {DEMO?Object.entries(v).forEach(([k,w])=>dSet(p+"/"+k,w)):db.ref(p).update(v);}
function fbPush(p,v)   {DEMO?dPush(p,v)                                      :db.ref(p).push(v);}
function fbOn(p,ev,cb) {DEMO?dOn(p,cb)                                       :db.ref(p).on(ev,s=>cb(s.val()));}

// state
let _prevKeys=new Set(), _typTimer=null, unread=0;
let locData = { me:null, gf:null };

// ── Floating hearts ─────────────────────
(function spawnHearts(){
  const c=document.getElementById("hearts");
  const emojis=["💕","💗","💖","💓","🌸","✨","💫","🩷"];
  for(let i=0;i<18;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(0.7+Math.random()*1.2)+"rem";
    h.style.animationDuration=(8+Math.random()*14)+"s";
    h.style.animationDelay=(Math.random()*12)+"s";
    c.appendChild(h);
  }
})();

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
window.addEventListener("DOMContentLoaded", () => {
  if (!currentUser) {
    document.getElementById("wrongScreen").style.display="flex";
    return;
  }

  document.getElementById("mainCard").style.display="flex";
  document.getElementById("chatNavTitle").textContent =
    currentUser==="me" ? "💬 Chat with Her 👧" : "💬 Chat with Him 👦";

  fbSet(`online/${currentUser}`, {online:true, ts:Date.now()});
  getIPLocation();
  setInterval(getIPLocation, 60000);

  listenLocations();
  listenChat();
  listenTyping();
  listenOnline();

  if (!DEMO) {
    db.ref(".info/connected").on("value", s=>{
      document.getElementById("liveDot").style.opacity = s.val()?1:0.4;
    });
  }
});

// ═══════════════════════════════════════
//  📡 IP LOCATION — no permission popup
// ═══════════════════════════════════════
async function getIPLocation() {
  const apis = [
    "https://ipapi.co/json/",
    "https://ip-api.com/json/?fields=lat,lon,city,regionName,country",
    "https://freeipapi.com/api/json"
  ];
  for (const api of apis) {
    try {
      const r = await fetch(api, {signal:AbortSignal.timeout(4000)});
      const d = await r.json();
      let lat,lng,city,region,country;
      if (d.latitude&&d.longitude)  { lat=d.latitude;  lng=d.longitude;  city=d.city||d.cityName; region=d.region||d.regionName; country=d.country_name||d.country||d.countryName; }
      else if (d.lat&&d.lon)        { lat=d.lat;        lng=d.lon;        city=d.city;              region=d.regionName;           country=d.country; }
      if (!lat) continue;
      const address=[city,region].filter(Boolean).join(", ")||country||"Unknown";
      fbUpdate(`locations/${currentUser}`,{lat,lng,address,method:"ip",ts:Date.now()});
      document.getElementById("locMethod").textContent="📡 IP location";
      return;
    } catch { continue; }
  }
  document.getElementById("locMethod").textContent="⚠️ Could not locate";
}

// ═══════════════════════════════════════
//  🎯 GPS UPGRADE
// ═══════════════════════════════════════
function upgradeToGPS() {
  if (!navigator.geolocation) { showToast("GPS not available"); return; }
  showToast("🎯 Getting GPS…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
    let address=`${lat.toFixed(4)},${lng.toFixed(4)}`;
    try {
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
        {headers:{"Accept-Language":"en"},signal:AbortSignal.timeout(5000)});
      const d=await r.json();
      const a=d.address||{};
      address=[a.suburb||a.village||a.town,a.city||a.county,a.country].filter(Boolean).join(", ");
    } catch {}
    fbUpdate(`locations/${currentUser}`,{lat,lng,address,method:"gps",ts:Date.now()});
    document.getElementById("locMethod").textContent=`🎯 GPS ±${Math.round(acc)}m`;
    const btn=document.getElementById("gpsBtn");
    btn.textContent="🎯 GPS Active — precise location on";
    btn.classList.add("gps-on"); btn.onclick=null;
    showToast("🎯 Precise GPS active!");
    setInterval(upgradeToGPS, 30000);
  }, ()=>showToast("GPS denied — using IP"), {enableHighAccuracy:true,timeout:10000});
}

// ═══════════════════════════════════════
//  LISTEN LOCATIONS
// ═══════════════════════════════════════
function listenLocations() {
  ["me","gf"].forEach(who=>{
    fbOn(`locations/${who}`,"value",data=>{
      if (!data) return;
      locData[who]=data;
      const {address,ts}=data;
      const locEl  = document.getElementById(who==="me"?"locMe":"locGf");
      const timeEl = document.getElementById(who==="me"?"timeMe":"timeGf");
      locEl.textContent  = address||"Located";
      timeEl.textContent = ts?"Updated "+timeSince(ts)+" ago":"";
      updateDistance();
    });
  });
}

function updateDistance() {
  const a=locData.me, b=locData.gf;
  if (!a||!b) {
    document.getElementById("distText").textContent="Waiting for both locations…";
    return;
  }
  const km = haversine(a.lat,a.lng,b.lat,b.lng);
  const txt = km<1 ? `${Math.round(km*1000)} meters apart 🥰`
            : km<50 ? `${km.toFixed(1)} km apart`
            : `${Math.round(km)} km apart`;
  document.getElementById("distText").textContent=txt;
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ═══════════════════════════════════════
//  CHAT
// ═══════════════════════════════════════
function openChat()  { document.getElementById("chatPanel").classList.add("open"); unread=0; const b=document.getElementById("chatBadge");b.style.display="none"; scrollChat(); document.getElementById("msgBox").focus(); }
function closeChat() { document.getElementById("chatPanel").classList.remove("open"); }

function sendMessage(){
  const box=document.getElementById("msgBox");
  const text=box.value.trim(); if(!text)return;
  box.value="";
  fbPush("chat",{who:currentUser,text,ts:Date.now()});
  fbSet(`typing/${currentUser}`,false);
}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}
function handleTyping(){
  fbSet(`typing/${currentUser}`,true);
  clearTimeout(_typTimer);
  _typTimer=setTimeout(()=>fbSet(`typing/${currentUser}`,false),2000);
}
function listenChat(){
  if(DEMO){setInterval(()=>{const msgs=dg()?.chat||{};Object.entries(msgs).sort((a,b)=>a[1].ts-b[1].ts).forEach(([k,v])=>{if(!_prevKeys.has(k)){_prevKeys.add(k);appendMsg(k,v);}});},800);return;}
  db.ref("chat").orderByChild("ts").on("child_added",s=>{if(!_prevKeys.has(s.key)){_prevKeys.add(s.key);appendMsg(s.key,s.val());}});
}
function appendMsg(key,msg){
  const isMe=msg.who===currentUser;
  const div=document.createElement("div");
  div.className="msg "+(isMe?"msg-me":"msg-other");
  const t=new Date(msg.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  div.innerHTML=`${esc(msg.text)}<span class="msgTime">${t}</span>`;
  document.getElementById("chatMessages").appendChild(div);
  scrollChat();
  if(!isMe&&!document.getElementById("chatPanel").classList.contains("open")){
    unread++; const b=document.getElementById("chatBadge");
    b.style.display="flex"; b.textContent=unread>9?"9+":unread;
  }
}
function scrollChat(){const c=document.getElementById("chatMessages");c.scrollTop=c.scrollHeight;}
function listenTyping(){
  fbOn(`typing/${OTHER[currentUser]}`,"value",v=>{
    document.getElementById("typingIndicator").textContent=v?"💬 typing…":"";
  });
}
function listenOnline(){
  fbOn(`online/${OTHER[currentUser]}`,"value",v=>{
    const el=document.getElementById("onlineStatus");
    const dot=document.getElementById(OTHER[currentUser]==="me"?"dotMe":"dotGf");
    if(v?.online){el.textContent="● online";el.style.color="#1abc9c";dot.classList.add("show");}
    else{el.textContent=`● ${v?.ts?timeSince(v.ts)+" ago":"offline"}`;el.style.color="#ffffff33";dot.classList.remove("show");}
  });
}

function timeSince(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+"s"; if(s<3600)return Math.floor(s/60)+"m"; return Math.floor(s/3600)+"h";
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2500);
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}

// Update "x ago" text every 30s
setInterval(()=>{
  ["me","gf"].forEach(who=>{
    const d=locData[who];
    if(!d?.ts)return;
    document.getElementById(who==="me"?"timeMe":"timeGf").textContent="Updated "+timeSince(d.ts)+" ago";
  });
},30000);
</script>
